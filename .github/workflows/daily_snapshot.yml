name: NAV + portfolio snapshot (manual)

# Manual only. GitHub's scheduled (cron) runs proved unreliable, so trigger this
# by hand: Actions tab -> "NAV + portfolio snapshot (manual)" -> Run workflow.
# Each run writes today's snapshot (past days are immutable), building the NAV
# history the Performance page charts.
on:
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy requests
      - name: NAV + portfolio snapshot
        run: python scripts/daily_snapshot.py
        env:
          SUPABASE_URL:    ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:    ${{ secrets.SUPABASE_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
