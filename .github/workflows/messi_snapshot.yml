name: NAV + portfolio snapshot — MESSI

# Same script as Itaka, but TABLE_PREFIX=messi_ points it at the messi_* tables
# in the shared Supabase project, so MESSI's data stays separate from ITAKA's.
# Runs automatically after the US close and can still be run by hand: Actions tab
# -> "NAV + portfolio snapshot — MESSI" -> Run workflow.
on:
  # GitHub starts scheduled jobs late (often by hours) and can drop them when it's
  # busy, so fire three times after the close, off the top of the hour. Re-running
  # just rewrites the same day. Cron is UTC — all three land after the 4pm ET
  # close in both EDT and EST.
  schedule:
    - cron: "17 21 * * 1-5"   # 5:17pm EDT / 4:17pm EST
    - cron: "47 22 * * 1-5"   # 6:47pm EDT / 5:47pm EST
    - cron: "13 0 * * 2-6"    # 8:13pm EDT / 7:13pm EST (next UTC day)
  workflow_dispatch: {}
  # Self-test: a change to the snapshot code or this file runs it once right away.
  push:
    branches: [main]
    paths:
      - scripts/**
      - book.py
      - risk.py
      - watchlist.py
      - .github/workflows/messi_snapshot.yml

# One MESSI run at a time (ITAKA has its own group, so the funds never block each other).
concurrency:
  group: messi-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy scipy requests
      - name: NAV + portfolio snapshot (Messi)
        run: python scripts/daily_snapshot.py
        env:
          SUPABASE_URL:    ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:    ${{ secrets.SUPABASE_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          TABLE_PREFIX:    "messi_"
