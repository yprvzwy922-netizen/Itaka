name: NAV + portfolio snapshot — MESSI (manual)

# Manual only. Same script as Itaka, but TABLE_PREFIX=messi_ points it at the
# messi_* tables in the shared Supabase project. Run by hand each trading day:
# Actions tab -> "NAV + portfolio snapshot — MESSI (manual)" -> Run workflow.
on:
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy requests
      - name: NAV + portfolio snapshot (Messi)
        run: python scripts/daily_snapshot.py
        env:
          SUPABASE_URL:    ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:    ${{ secrets.SUPABASE_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          TABLE_PREFIX:    "messi_"
